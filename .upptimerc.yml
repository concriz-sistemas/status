# Monitoramento de uptime dos servicos Concriz
# Docs: https://upptime.js.org/docs/configuration

owner: qremmax
repo: status

# UA identificavel nos logs do servidor, para nao confundir com bot/scraper.
user-agent: "Concriz-Status/1.0 (+https://github.com/qremmax/status)"

sites:
  # A API e o sinal mais confiavel de queda: e dinamica, entao a resposta vem
  # sempre da origem (HostGator) e nao do cache do Cloudflare. Alem do 200,
  # exigimos o corpo do health check — assim uma pagina de erro devolvida com
  # 200 tambem conta como queda.
  - name: API
    url: https://concriz.com/api/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    maxResponseTime: 5000

  # Site institucional (pdv-site). Sem checagem de corpo de proposito: o titulo
  # e os textos mudam por SEO, e isso viraria alarme falso.
  - name: Site
    url: https://concriz.com/
    maxResponseTime: 5000

  # Gestor Web (build Flutter). "flutter_bootstrap" e estavel entre releases e
  # nao aparece em pagina de erro do Cloudflare.
  - name: Gestor Web
    url: https://concriz.com/web/
    __dangerous__body_down_if_text_missing: "flutter_bootstrap"
    maxResponseTime: 5000

  # TEMPORARIO — teste de fumaça do caminho de alerta. Endpoint inexistente de
  # proposito, para exercitar a transicao up->down (Issue + Telegram) sem
  # esperar uma queda real. REMOVER depois do teste.
  - name: Teste de alerta
    url: https://concriz.com/api/health
    maxResponseTime: 5000

status-website:
  # Sem dominio proprio por enquanto: a pagina fica em qremmax.github.io/status.
  # Para migrar para status.concriz.com, trocar baseUrl por `cname` e criar o
  # CNAME no Cloudflare apontando para qremmax.github.io.
  baseUrl: /status
  name: Status Concriz
  introTitle: "Disponibilidade dos servicos Concriz"
  introMessage: "Monitoramento automatico da API, do site e do Gestor Web, verificado a cada 5 minutos. O historico completo e publico neste [repositorio](https://github.com/qremmax/status)."
  navbar:
    - title: Status
      href: /
    - title: Concriz
      href: https://concriz.com

# Allowlist explicita de secrets (least privilege). Somente estes sao injetados
# nos workflows gerados; GH_PAT e tratado separadamente pelo Upptime.
secrets:
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID

